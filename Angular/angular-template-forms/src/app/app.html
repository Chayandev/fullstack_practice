<h2>Angular Template Driven Forms</h2>

<form #userForm="ngForm" (submit)="addDetails(userForm.value)">
  <input type="text" placeholder="Enter Name" name="name" ngModel>
  <br><br>
  <input type="text" placeholder="Enter Email" name="email" ngModel>
  <br><br>
  <select name="gender" ngModel>
    <option value="">Select Gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>
    <br><br>
  <input type="text" placeholder="password" name="password" ngModel>
  <br><br>
  <button>Submit</button>
</form>
